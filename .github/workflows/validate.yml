name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Disable Git autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci
      - name: Check code formatting
        run: npm run format:check
      - name: Run linter
        run: npm run lint
      - name: Check architecture boundaries
        run: npm run check:boundaries
      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:unit
      - name: Run integration tests
        if: runner.os != 'Windows'
        run: npm run test:integration
      - name: Run smoke tests
        run: npm run release:smoke

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Extract package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Release v${{ steps.pkg.outputs.version }}
          draft: false
          prerelease: false
          files: local-model-workers-mcp-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm registry
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public || echo "npm publish skipped or already published"
          else
            echo "NPM_TOKEN not set; skipping public npm publish"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
